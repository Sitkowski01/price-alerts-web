name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Typy, testy i build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Kontrola typów
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Build produkcyjny
        run: npm run build

      - name: Przeglądarka dla Playwrighta
        run: npx playwright install --with-deps chromium

      - name: Testy w przeglądarce
        run: npm run test:e2e

      - name: Raport z testów w przeglądarce
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
